{{ define "main" }}
<article class="shell standard-page">
	<header class="page-head">
		{{- with .Params.eyebrow }}<p class="eyebrow">{{ . }}</p>{{ end }}
		<h1>{{ .Title }}</h1>
		{{- with .Params.lede }}<p class="page-intro prose-narrow">{{ . }}</p>{{ end }}
	</header>
	<div class="content {{ if .Params.wide }}page-wide{{ else }}prose-page{{ end }}">
		{{ .Content }}
	</div>
</article>
{{ end }}
